name: Verificar integridade do Carbono
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm ci
      - name: Validar arquivos do projeto
        run: npm test
      - name: Validar sintaxe do JavaScript publicado
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import vm from 'node:vm';
          const html=fs.readFileSync('index.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(s=>s.trim());
          if(!scripts.length) throw new Error('Nenhum script inline no index.html');
          for(const js of scripts) new vm.Script(js,{filename:'index.html/inline'});
          console.log('JavaScript validado: '+scripts.length+' bloco(s).');
          JS
      - name: Verificar se o index corresponde ao build
        run: |
          node build.mjs
          git diff --exit-code -- index.html
